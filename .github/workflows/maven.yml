# Builds and tests every microservice with Maven on JDK 25.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required by the dependency submission step (push to main only)
      contents: write

    strategy:
      fail-fast: false
      matrix:
        service: [ product-service, category-service, gateway-service ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build & test ${{ matrix.service }}
        run: mvn -B -ntp verify --file ./${{ matrix.service }}/pom.xml

      # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts.
      # Skipped on pull requests because their token is read-only.
      - name: Update dependency graph
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c
        with:
          directory: ${{ matrix.service }}
          correlator: ${{ github.job }}-${{ matrix.service }}
          # The action resolves mvnw relative to `directory` twice; use the runner's Maven instead
          ignore-maven-wrapper: true
